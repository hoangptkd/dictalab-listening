services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dictalab_messaging_test
      POSTGRES_USER: dictalab_test
      POSTGRES_PASSWORD: ${MESSAGING_TEST_PASSWORD:?Required test password}
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictalab_test -d dictalab_messaging_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.2-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dictalab_test
      RABBITMQ_DEFAULT_PASS: ${MESSAGING_TEST_PASSWORD:?Required test password}
    ports: ["127.0.0.1::5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

spring:
  application:
    name: dictalab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/dictalab}
    username: ${DB_USERNAME:dictalab_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

server:
  port: ${PORT:18081}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

dictalab:
  public-url: ${DICTALAB_PUBLIC_URL:http://localhost:18081}
  mail-from: ${DICTALAB_MAIL_FROM:}
  shopaikey:
    api-key: ${SHOPAIKEY_API_KEY:}
    model: ${SHOPAIKEY_MODEL:claude-sonnet-4-5}
    url: ${SHOPAIKEY_URL:https://api.shopaikey.com/v1/chat/completions}
  assessment:
    minimum-unseen-lessons: 5
    maximum-unseen-lessons: 10
  admin:
    emails: ${DICTALAB_ADMIN_EMAILS:}
  media:
    root: ${DICTALAB_MEDIA_ROOT:./data/media}
    max-file-size: 25MB
  personal-content:
    enabled: ${DICTALAB_PERSONAL_CONTENT_ENABLED:false}
    root: ${DICTALAB_PERSONAL_CONTENT_ROOT:./data/personal-content}
    manifest: ${DICTALAB_PERSONAL_CONTENT_MANIFEST:./data/personal-content/manifest.json}
  scoring:
    first-attempt-weight: 0.65
    final-accuracy-weight: 0.25
    independence-weight: 0.10
    first-letter-penalty: 2.0
    word-reveal-penalty: 8.0
    sentence-reveal-penalty: 20.0
    extra-replay-penalty: 1.5
  room:
    allowed-origins: ${DICTALAB_ALLOWED_ORIGINS:http://localhost:18081,http://127.0.0.1:18081,https://160.191.244.27:18443}
    turn-url: ${DICTALAB_TURN_URL:}
    turn-secret: ${DICTALAB_TURN_SECRET:}
    turn-ttl-seconds: ${DICTALAB_TURN_TTL_SECONDS:3600}

management:
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  tracing:
    export:
      enabled: false
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:h2:mem:dictalabtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

dictalab:
  payment-operations:
    worker-enabled: false
    reconcile-enabled: false
    dispatch-delay-ms: 600000
    reconcile-delay-ms: 600000
  ai:
    budget:
      enabled: false
  auth:
    signing-key: dGVzdC1vbmx5LWRpY3RhbGFiLXNpZ25pbmcta2V5LTMyaGFyYWN0ZXJz
    cookie-secure: false
  email:
    dispatch-delay-ms: 600000
  listening:
    dispatch-delay-ms: 600000
  rate-limit:
    enabled: false
  assessment:
    minimum-unseen-lessons: 5
    maximum-unseen-lessons: 10
  admin:
    emails:
      - admin@dictalab.local
      - verified-admin@dictalab.local
  media:
    root: target/test-media
    max-file-size: 2MB
  scoring:
    first-attempt-weight: 0.65
    final-accuracy-weight: 0.25
    independence-weight: 0.10
    first-letter-penalty: 2.0
    word-reveal-penalty: 8.0
    sentence-reveal-penalty: 20.0
    extra-replay-penalty: 1.5
  room:
    allowed-origins: http://localhost:18081
    turn-url:
    turn-secret:
    turn-ttl-seconds: 3600

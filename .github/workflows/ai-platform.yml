name: AI Platform checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'services/ai-generation/**'
      - 'services/model-serving/**'
      - 'training/generate_teacher_data.py'
      - 'training/benchmark_teacher.py'
      - 'training/semantic_rubric.py'
      - 'training/freeze_candidate.py'
      - 'training/prepare_dataset.py'
      - 'training/tests/test_generate_teacher_data.py'
      - 'training/tests/test_benchmark_teacher.py'
      - 'training/tests/test_prepare_dataset.py'
      - 'training/requirements-prepare.lock'
      - 'tools/ai-eval/**'
      - 'artifacts/prompts/**'
      - 'artifacts/reports/ai-platform-*.json'
      - 'src/**'
      - 'compose.yaml'
      - '.dockerignore'
      - 'pom.xml'
      - 'ops/observability/**'
      - 'scripts/run-local.ps1'
      - 'scripts/test-run-local-env.ps1'
      - 'scripts/run-model-demo.ps1'
      - 'scripts/run-service.py'
      - 'scripts/linux/service-bundle.py'
      - 'scripts/linux/test_service_bundle.py'
      - 'scripts/linux/test_service_units.py'
      - 'scripts/linux/dictalab-ai*.service'
      - 'scripts/linux/dictalab-progress.service'
      - '.env*.example'
      - '.github/workflows/ai-platform.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.6-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install pinned Python runtime and test tools
        run: python -m pip install -r services/ai-generation/requirements.lock -r training/requirements-prepare.lock pytest==8.4.2 pytest-asyncio==0.26.0
      - name: Python contracts, registry, readiness, regression and golden metrics
        env:
          TEST_GEMINI_REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest -q services/ai-generation/tests services/model-serving/test_server.py tools/ai-eval training/tests/test_generate_teacher_data.py training/tests/test_benchmark_teacher.py training/tests/test_prepare_dataset.py
      - name: Java routing and contract tests
        env:
          TEST_GEMINI_REDIS_URL: redis://127.0.0.1:6379/15
        run: mvn --batch-mode --no-transfer-progress -Dtest=ConversationShadowContractTest,ConversationB1EvidenceTest,ConversationLevelProfileTest,ConversationLocalClientTest,ConversationGenerationPromptTest,ConversationPythonClientTest,ConversationRolloutTest,ConversationContentTest,ConversationIntegrationTest,ConversationUxIntegrationTest,ModelDemoIntegrationTest,AiPlatformClientTest,AiBackgroundJobsIntegrationTest,AiUsageBudgetIntegrationTest,CoachServiceIntegrationTest,CoachLocalServiceIntegrationTest,CoachLocalQueueIntegrationTest,GeminiClientTest,GeminiProviderPropertiesTest,GeminiQuotaCoordinatorTest,GeminiQuotaRedisIntegrationTest,AiProviderRegistryTest,ListeningComprehensionIntegrationTest test
      - name: Java to Python to fake Ollama smoke
        run: python tools/ai-eval/smoke.py
      - name: Private registry migration, backup restore and database isolation
        run: python tools/ai-eval/registry_smoke.py
      - name: Java API RabbitMQ worker smoke, local/cloud routing and capacity sweep
        env:
          AI_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2F
        run: python tools/ai-eval/jobs_smoke.py
      - name: AI observability alert contracts
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/ops/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml
      - name: Validate Compose and image packaging
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          RABBITMQ_USER: test
          RABBITMQ_PASSWORD: test-only
        run: |
          docker compose --profile ai --profile ai-worker config --quiet
          docker build -f services/ai-generation/Dockerfile -t dictalab-ai-check .
          docker run --rm dictalab-ai-check python -c "from app.config import Settings; from app.registry import load_artifact; from app.registry_migration import schema_checksum; from app.conversation_demo import artifact; print(load_artifact(Settings())['version'], artifact(Settings())['version'], schema_checksum())"
      - name: Encoding and diff checks
        run: |
          python tools/ai-eval/check_encoding.py
          git diff --check
      - name: Verify coordinated service release packaging
        run: |
          sudo "$(command -v python)" -m unittest discover -s scripts/linux -p test_service_bundle.py
          command -v systemd-analyze
          python -m unittest discover -s scripts/linux -p test_service_units.py
          python scripts/linux/service-bundle.py build --revision "$GITHUB_SHA" --output target/microservices-release.tar.gz
          bundle_sha256=$(sha256sum target/microservices-release.tar.gz | cut -d ' ' -f 1)
          sudo "$(command -v python)" scripts/linux/service-bundle.py stage target/microservices-release.tar.gz --sha256 "$bundle_sha256"
      - name: Local dotenv quoting contract
        shell: pwsh
        run: |
          ./scripts/test-run-local-env.ps1
          ./scripts/test-run-local-env.ps1 -LauncherName run-model-demo.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-platform-evidence
          retention-days: 7
          path: |
            artifacts/reports/ai-platform-*.json
            target/surefire-reports/
            target/ai-platform-jobs-load.json

name: Progress service checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  contracts-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Progress against production PostgreSQL 17 and RabbitMQ
        run: mvn -f services/progress/pom.xml --batch-mode --no-transfer-progress -Ddictalab.testcontainers.postgres-image=postgres:17.11-alpine verify
      - name: Verify Core outbox and packaged service recovery
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Ddictalab.testcontainers=true
          -Ddictalab.testcontainers.postgres-image=postgres:17.11-alpine
          -Dspring.profiles.active=postgres-test
          -Dtest=ProgressOutboxIntegrationTest,ProgressDeliveryIntegrationTest,ProgressClientTest test
      - name: Validate image and Compose packaging
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          RABBITMQ_USER: test
          RABBITMQ_PASSWORD: test-only
          PROGRESS_DB_PASSWORD: test-only
          PROGRESS_SERVICE_TOKEN: ci-progress-test-token-at-least-32-chars
        run: |
          docker compose --profile messaging --profile progress config --quiet
          docker build -t dictalab-progress-check services/progress
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || failure())
        continue-on-error: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
        with:
          name: progress-service-evidence
          retention-days: 3
          path: |
            services/progress/target/surefire-reports/
            target/surefire-reports/
            target/readiness/progress-delivery/
          if-no-files-found: error

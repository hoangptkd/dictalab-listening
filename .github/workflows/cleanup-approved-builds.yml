name: Clean approved legacy application builds

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Delete application archives created before 24 October 2026 (Bangkok)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cleanup-approved-legacy-builds
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Inspect and remove only the owner-approved application archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLY_DELETE: ${{ inputs.delete }}
        shell: python
        run: |
          import datetime as dt
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          if repository != 'hoangptkd/dictalab-listening':
              raise ValueError('Cleanup is authorized only for the original repository')
          # Owner approval: application only, before 24 October in Bangkok (UTC+7).
          cutoff = dt.datetime.fromisoformat('2026-10-23T17:00:00+00:00')

          def approved(artifact):
              created = dt.datetime.fromisoformat(artifact['created_at'].replace('Z', '+00:00'))
              if created.tzinfo is None:
                  raise ValueError('Artifact creation time must include its timezone')
              return artifact['name'] == 'application' and created < cutoff

          # Runnable boundary checks also run before any network mutation.
          assert approved({'name': 'application', 'created_at': '2026-10-23T16:59:59Z'})
          assert not approved({'name': 'application', 'created_at': '2026-10-23T17:00:00Z'})
          assert not approved({'name': 'application', 'created_at': '2026-10-24T00:00:00Z'})
          assert not approved({'name': 'unit-test-reports', 'created_at': '2026-10-17T00:00:00Z'})
          assert not approved({'name': 'application-backup', 'created_at': '2026-10-17T00:00:00Z'})

          base = 'https://api.github.com/repos/' + repository + '/actions/artifacts'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'DictaLab-approved-artifact-cleanup'}

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return None if response.status == 204 else json.load(response)

          # Snapshot every page before deletion so pagination cannot skip shifted rows.
          candidates = []
          for page in range(1, 1001):
              artifacts = request(base + '?per_page=100&page=' + str(page))['artifacts']
              candidates.extend(a for a in artifacts if approved(a))
              if len(artifacts) < 100:
                  break
          else:
              raise RuntimeError('Artifact inventory exceeded the safety bound')

          apply = os.environ.get('APPLY_DELETE') == 'true'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Approved legacy application cleanup\n\n')
              summary.write('Mode: ' + ('delete' if apply else 'preview') + '\n\n')
              summary.write('Only `application` created before 2026-10-24 00:00 UTC+7.\n\n')
              summary.write('Artifacts selected: ' + str(len(candidates)) + '\n\n')
              for artifact in candidates:
                  url = base + '/' + str(int(artifact['id']))
                  current = request(url)
                  if current['id'] != artifact['id'] or not approved(current):
                      raise RuntimeError('Artifact changed since inventory')
                  record = {key: current[key] for key in ('id', 'name', 'created_at', 'size_in_bytes')}
                  record['run_id'] = current.get('workflow_run', {}).get('id')
                  print(json.dumps(record), flush=True)
                  if apply:
                      request(url, 'DELETE')
                  record['result'] = 'deleted' if apply else 'preview'
                  summary.write('- `' + json.dumps(record) + '`\n')
                  summary.flush()

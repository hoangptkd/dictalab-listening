name: Clean approved legacy application builds

on:
  push:
    branches: ['codex/practice-drafts-audio-20261017']
    paths: ['.github/workflows/cleanup-approved-builds.yml']
  workflow_dispatch:
    inputs:
      delete:
        description: Delete only approved obsolete artifacts; preserve deploys 45 and 47
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cleanup-approved-legacy-builds
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Preview or delete approved obsolete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLY_DELETE: ${{ inputs.delete }}
        shell: python
        run: |
          import datetime as dt
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          if repository != 'hoangptkd/dictalab-listening':
              raise ValueError('Cleanup is authorized only for the original repository')
          # Fixed owner-approved snapshot: 28 October 2026, midnight Bangkok.
          cutoff = dt.datetime.fromisoformat('2026-10-27T17:00:00+00:00')
          report_cutoff = cutoff - dt.timedelta(days=7)
          protected = {40101541064, 40021657768}
          reports = {'unit-test-reports', 'ai-platform-evidence',
                     'progress-service-evidence', 'dependency-scan',
                     'postgres-test-reports-17.11-alpine', 'postgres-test-reports-18.4-alpine',
                     'reliability-17.11-alpine', 'reliability-18.4-alpine'}

          def approved(artifact, run, newer_success=False):
              created = dt.datetime.fromisoformat(artifact['created_at'].replace('Z', '+00:00'))
              if created.tzinfo is None:
                  raise ValueError('Artifact creation time must include its timezone')
              if artifact.get('expired') or run['id'] in protected or run['status'] != 'completed':
                  return False
              if artifact['name'] == 'application':
                  return created < cutoff
              return (artifact['name'] in reports and created < report_cutoff
                      and (run['conclusion'] == 'success' or newer_success))

          # Runnable policy checks execute before any network mutation.
          sample = {'name': 'application', 'created_at': '2026-10-27T16:59:59Z'}
          done = {'id': 1, 'status': 'completed', 'conclusion': 'failure'}
          assert approved(sample, done)
          assert not approved(sample, dict(done, id=40101541064))
          assert not approved(sample, dict(done, id=40021657768))
          assert not approved(sample, dict(done, status='in_progress'))
          assert not approved(sample, dict(done, status='queued'))
          assert not approved(dict(sample, expired=True), done)
          assert not approved(dict(sample, created_at='2026-10-27T17:00:00Z'), done)
          assert not approved(dict(sample, name='application-backup'), done)
          old_report = dict(sample, name='unit-test-reports', created_at='2026-10-20T16:59:59Z')
          assert not approved(old_report, done)
          assert approved(old_report, done, newer_success=True)
          assert approved(old_report, dict(done, conclusion='success'))
          assert not approved(dict(old_report, created_at='2026-10-20T17:00:00Z'), done, True)
          assert not approved(dict(old_report, name='unknown'), done, True)

          base = 'https://api.github.com/repos/' + repository + '/actions'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'DictaLab-approved-artifact-cleanup'}

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return None if response.status == 204 else json.load(response)

          def inventory(resource, key):
              items = []
              for page in range(1, 1001):
                  batch = request(base + '/' + resource + '?per_page=100&page=' + str(page))[key]
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
              raise RuntimeError('Inventory exceeded the safety bound')

          runs = {run['id']: run for run in inventory('runs', 'workflow_runs')}
          latest_success = {}
          for run in runs.values():
              if run['status'] == 'completed' and run['conclusion'] == 'success':
                  key = (run['workflow_id'], run['head_branch'])
                  if key not in latest_success or run['created_at'] > latest_success[key]['created_at']:
                      latest_success[key] = run
          protected.update(run['id'] for run in latest_success.values())

          def selectable(artifact):
              run = runs.get(artifact.get('workflow_run', {}).get('id'))
              if run is None:
                  return False
              success = latest_success.get((run['workflow_id'], run['head_branch']))
              return approved(artifact, run, success is not None and success['created_at'] > run['created_at'])

          artifacts = inventory('artifacts', 'artifacts')
          candidates = [artifact for artifact in artifacts if selectable(artifact)]
          apply = os.environ.get('APPLY_DELETE') == 'true'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Approved obsolete artifact cleanup\n\n')
              summary.write('Mode: ' + ('delete' if apply else 'preview') + '\n\n')
              summary.write('Preserve deploys #45 and #47, latest successful runs, active runs, and unresolved failures.\n\n')
              summary.write('Artifacts inventoried: ' + str(len(artifacts)) + '\n\n')
              summary.write('Artifacts selected: ' + str(len(candidates)) + '\n\n')
              summary.write('Bytes selected: ' + str(sum(a['size_in_bytes'] for a in candidates)) + '\n\n')
              for artifact in candidates:
                  url = base + '/artifacts/' + str(int(artifact['id']))
                  current = request(url)
                  if current['id'] != artifact['id'] or current['workflow_run']['id'] != artifact['workflow_run']['id'] or not selectable(current):
                      raise RuntimeError('Artifact changed since inventory')
                  record = {key: current[key] for key in ('id', 'name', 'created_at', 'size_in_bytes')}
                  record['run_id'] = current['workflow_run']['id']
                  print(json.dumps(record), flush=True)
                  if apply:
                      request(url, 'DELETE')
                  record['result'] = 'deleted' if apply else 'preview'
                  summary.write('- `' + json.dumps(record) + '`\n')
                  summary.flush()
              if apply:
                  remaining = {a['id'] for a in inventory('artifacts', 'artifacts')}
                  if any(a['id'] in remaining for a in candidates):
                      raise RuntimeError('Selected artifacts remain after deletion')
                  if any(a['workflow_run']['id'] in protected and a['id'] not in remaining for a in artifacts if not a['expired']):
                      raise RuntimeError('A protected artifact is missing after cleanup')
                  summary.write('\nVerified: selected artifacts removed; protected artifacts retained.\n')

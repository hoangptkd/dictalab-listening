name: Test and deploy to Linux VPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Check both PostgreSQL versions without deploying
        type: boolean
        default: false
  schedule:
    - cron: '23 20 * * 6'

permissions:
  contents: read

concurrency:
  group: dictalab-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'schedule' || inputs.full_compatibility) && 'compatibility' || 'production' }}
  cancel-in-progress: false

jobs:
  progress:
    uses: ./.github/workflows/progress.yml

  ai-platform:
    uses: ./.github/workflows/ai-platform.yml

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check browser code and run JavaScript tests
        run: |
          node --check src/main/resources/static/js/app.js
          node --check src/main/resources/static/js/listening.js
          node --check src/main/resources/static/js/account.js
          node --test src/test/js/*.cjs
          node scripts/test-b1-expansion.cjs

      - name: Check release and dependency scanner behavior
        run: python3 -m unittest discover -s scripts/linux -p 'test_*.py'

      - name: Run tests and build executable JAR
        run: mvn --batch-mode --no-transfer-progress -Pproduction-s3,ci-unit clean verify

      - name: Verify S3 production packaging and published lesson pages
        run: python3 scripts/verify-production-jar.py target/english-dictation-0.1.0-SNAPSHOT.jar

      - name: Rehearse owner migration and runtime grants on isolated PostgreSQL 17
        env:
          TEST_CORE_SCHEMA_JAR: target/english-dictation-0.1.0-SNAPSHOT.jar
        run: python3 -m unittest discover -s scripts/linux -p test_service_schema.py -v

      - name: Resolve and scan runtime dependencies
        run: |
          mvn --batch-mode --no-transfer-progress dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 scripts/scan-dependencies.py target/runtime-dependencies.txt target/dependency-scan.json

      - name: Save dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          retention-days: 7
          path: |
            target/runtime-dependencies.txt
            target/dependency-scan.json

      - name: Save unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          retention-days: 7
          path: target/surefire-reports/

      - name: Build and verify the immutable three-service bundle
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_compatibility)) && github.ref == 'refs/heads/main'
        run: python3 scripts/linux/service-bundle.py build --revision "$GITHUB_SHA" --output target/services.tar.gz

      - name: Save verified application
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_compatibility)) && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: application
          retention-days: 14
          path: target/services.tar.gz
          if-no-files-found: error

  postgres-tests:
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_compatibility) && '["17.11-alpine","18.4-alpine"]' || '["18.4-alpine"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dictalab_test
          POSTGRES_USER: dictalab_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dictalab_test -d dictalab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run the integration suite on PostgreSQL with Flyway
        id: postgres-tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/dictalab_test
          TEST_DB_USERNAME: dictalab_test
          TEST_DB_PASSWORD: test-only-password
        run: >-
          mvn --batch-mode --no-transfer-progress -Pci-integration -Dspring.profiles.active=postgres-test
          -Dspring.datasource.hikari.minimum-idle=0 -Dspring.test.context.cache.maxSize=4 test

      - name: Save PostgreSQL test reports
        if: always() && steps.postgres-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports-${{ matrix.postgres }}
          retention-days: 7
          path: target/surefire-reports/

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_compatibility) && '["17.11-alpine","18.4-alpine"]' || '["18.4-alpine"]') }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run mandatory concurrency and messaging tests with Testcontainers
        run: >-
          mvn --batch-mode --no-transfer-progress -Preliability,production-s3
          -Ddictalab.testcontainers.postgres-image=postgres:${{ matrix.postgres }}
          -Ddictalab.build.directory=target/reliability
          -Ddictalab.race-evidence=target/reliability/concurrency-matrix.csv test
      - name: Reject missing or skipped reliability tests
        run: |
          node scripts/verify-reliability-tests.cjs target/reliability/surefire-reports
          test -s target/reliability/concurrency-matrix.csv
      - name: Save reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.postgres }}
          retention-days: 7
          path: |
            target/reliability/surefire-reports/
            target/reliability/worker-recovery-*/
            target/reliability/ai-worker-recovery/
            target/reliability/restore-isolation/
            target/reliability/payment-restore/
            target/reliability/payment-concurrency.json
            target/reliability/concurrency-matrix.csv
          if-no-files-found: error

  deploy:
    needs: [test-build, postgres-tests, reliability, ai-platform, progress]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_compatibility)) && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.PRODUCTION_DEPLOY_TARGET == 'ec2-services'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target

      - name: Verify deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_sha256="$(sha256sum target/services.tar.gz | awk '{print $1}')"
          python3 scripts/linux/service-bundle.py verify target/services.tar.gz --sha256 "$bundle_sha256"

      - name: Configure SSH authentication
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Assume the scoped EC2 network role through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::042407443847:role/dictalab-github-deploy-network
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          allowed-account-ids: '042407443847'

      - name: Permit SSH from this runner only
        id: runner-ssh
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)"
          runner_ip="$(python3 -c 'import ipaddress,sys; print(ipaddress.IPv4Address(sys.argv[1]))' "$runner_ip")"
          rule_id="$(aws ec2 authorize-security-group-ingress \
            --group-id sg-0e56b7760ff44be60 \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$runner_ip/32,Description=GitHub-Actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)"
          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]
          printf 'rule_id=%s\n' "$rule_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the runner SSH rule to propagate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if timeout 5 bash -c 'exec 3<>/dev/tcp/54.254.221.170/22'; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Upload release to EC2
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test "$VPS_HOST" = 54.254.221.170
          ssh_options=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          )
          stage="/home/ubuntu/dictalab-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$VPS_USER" = ubuntu
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$stage'"
          scp "${ssh_options[@]}" target/services.tar.gz scripts/linux/service-release.py scripts/linux/service-schema.py "$VPS_USER@$VPS_HOST:$stage/"

      - name: Activate coordinated EC2 release with owner migration and rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = 54.254.221.170
          test "$VPS_USER" = ubuntu
          bundle_sha256="$(sha256sum target/services.tar.gz | awk '{print $1}')"
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$bundle_sha256" <<'REMOTE'
          set -euo pipefail
          stage="/home/ubuntu/dictalab-release-$1-$2"
          evidence="/var/lib/dictalab-service-backups/deploy-$1-$2"
          sudo -n test ! -e /etc/caddy/dictalab-maintenance
          sudo -n install -d -m 700 "$evidence"
          sudo -n cp -a /opt/dictalab/tools/service-release.py "$evidence/service-release.py.before"
          sudo -n install -o root -g root -m 644 "$stage/service-release.py" "$stage/service-schema.py" /opt/dictalab/tools/
          python=/opt/dictalab/services/current/venv/bin/python
          sudo -n "$python" /opt/dictalab/tools/service-bundle.py stage "$stage/services.tar.gz" --sha256 "$3"
          sudo -n "$python" /opt/dictalab/tools/service-release.py "$stage/services.tar.gz" --sha256 "$3" --postgres-major 17 --migrate-core --rollback-compatible --maintenance
          sudo -n /usr/local/sbin/dictalab-services start
          REMOTE

      - name: Verify public health endpoint
        shell: bash
        env:
          PUBLIC_BASE_URL: https://dictalab.hoangptkdhy.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 --max-time 10 \
            "$PUBLIC_BASE_URL/actuator/health" | jq -e '.status == "UP"'

      - name: Revoke this runner SSH rule
        if: always() && steps.runner-ssh.outputs.rule_id != ''
        shell: bash
        env:
          RUNNER_SSH_RULE: ${{ steps.runner-ssh.outputs.rule_id }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_SSH_RULE" =~ ^sgr-[0-9a-f]+$ ]]
          aws ec2 revoke-security-group-ingress --group-id sg-0e56b7760ff44be60 \
            --security-group-rule-ids "$RUNNER_SSH_RULE"

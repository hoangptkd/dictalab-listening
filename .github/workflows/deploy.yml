name: Test and deploy to Linux VPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictalab-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check browser code and run JavaScript tests
        run: |
          node --check src/main/resources/static/js/app.js
          node --check src/main/resources/static/js/listening.js
          node --check src/main/resources/static/js/account.js
          node --test src/test/js/*.cjs
          node scripts/test-b1-expansion.cjs

      - name: Check release and dependency scanner behavior
        run: python3 -m unittest discover -s scripts/linux -p 'test_*.py'

      - name: Resolve and scan runtime dependencies
        run: |
          mvn --batch-mode --no-transfer-progress dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 scripts/scan-dependencies.py target/runtime-dependencies.txt target/dependency-scan.json

      - name: Save dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: |
            target/runtime-dependencies.txt
            target/dependency-scan.json

      - name: Run tests and build executable JAR
        run: mvn --batch-mode --no-transfer-progress -Pproduction-s3 clean verify

      - name: Verify S3 production packaging and published lesson pages
        run: python3 scripts/verify-production-jar.py target/english-dictation-0.1.0-SNAPSHOT.jar

      - name: Save H2 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-test-reports
          path: target/surefire-reports/

      - name: Save verified application
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/english-dictation-0.1.0-SNAPSHOT.jar
          if-no-files-found: error

  postgres-tests:
    strategy:
      matrix:
        postgres: ['17.11-alpine', '18.4-alpine']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dictalab_test
          POSTGRES_USER: dictalab_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dictalab_test -d dictalab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run the integration suite on PostgreSQL with Flyway
        id: postgres-tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/dictalab_test
          TEST_DB_USERNAME: dictalab_test
          TEST_DB_PASSWORD: test-only-password
        run: >-
          mvn --batch-mode --no-transfer-progress -Dspring.profiles.active=postgres-test
          -Dspring.datasource.hikari.minimum-idle=0 -Dspring.test.context.cache.maxSize=4 test

      - name: Save PostgreSQL test reports
        if: always() && steps.postgres-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports-${{ matrix.postgres }}
          path: target/surefire-reports/

  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        postgres: ['17.11-alpine', '18.4-alpine']
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run mandatory concurrency and messaging tests with Testcontainers
        run: >-
          mvn --batch-mode --no-transfer-progress -Preliability,production-s3
          -Ddictalab.testcontainers.postgres-image=postgres:${{ matrix.postgres }}
          -Ddictalab.build.directory=target/reliability
          -Ddictalab.race-evidence=target/reliability/concurrency-matrix.csv test
      - name: Reject missing or skipped reliability tests
        run: |
          node scripts/verify-reliability-tests.cjs target/reliability/surefire-reports
          test -s target/reliability/concurrency-matrix.csv
      - name: Save reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.postgres }}
          path: |
            target/reliability/surefire-reports/
            target/reliability/worker-recovery-*/
            target/reliability/ai-worker-recovery/
            target/reliability/restore-isolation/
            target/reliability/concurrency-matrix.csv
          if-no-files-found: error

  deploy:
    needs: [test-build, postgres-tests, reliability]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target

      - name: Select deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*.original' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" dictalab-new.jar
          sha256sum dictalab-new.jar
          python3 scripts/verify-production-jar.py dictalab-new.jar

      - name: Configure SSH authentication
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Upload release to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh_options=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          )
          stage="/home/ubuntu/dictalab-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$VPS_USER" = ubuntu
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$stage'"
          scp "${ssh_options[@]}" dictalab-new.jar "$VPS_USER@$VPS_HOST:$stage/dictalab.jar"
          scp "${ssh_options[@]}" scripts/linux/release.py "$VPS_USER@$VPS_HOST:$stage/release.py"

      - name: Activate release with automatic rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum dictalab-new.jar | awk '{print $1}')"
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n python3 /home/ubuntu/dictalab-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/release.py /home/ubuntu/dictalab-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} $artifact_sha256"

      - name: Verify public health endpoint
        shell: bash
        env:
          PUBLIC_BASE_URL: https://dictalab.hoangptkdhy.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 --max-time 10 \
            "$PUBLIC_BASE_URL/actuator/health" | jq -e '.status == "UP"'

name: Test and deploy to Windows VPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictalab-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test-build:
    strategy:
      matrix:
        postgres: ['17.11-alpine', '18.4-alpine']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dictalab_test
          POSTGRES_USER: dictalab_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dictalab_test -d dictalab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check browser code and run JavaScript tests
        run: |
          node --check src/main/resources/static/js/app.js
          node --check src/main/resources/static/js/listening.js
          node --check src/main/resources/static/js/account.js
          node --test src/test/js/*.cjs

      - name: Run tests and build executable JAR
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Save H2 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-test-reports-${{ matrix.postgres }}
          path: target/surefire-reports/

      - name: Run the integration suite on PostgreSQL with Flyway
        id: postgres-tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports[5432] }}/dictalab_test
          TEST_DB_USERNAME: dictalab_test
          TEST_DB_PASSWORD: test-only-password
        run: mvn --batch-mode --no-transfer-progress -Dspring.profiles.active=postgres-test test

      - name: Save PostgreSQL test reports
        if: always() && steps.postgres-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports-${{ matrix.postgres }}
          path: target/surefire-reports/

      - name: Save verified application
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.postgres == '17.11-alpine'
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar
          if-no-files-found: error

  deploy:
    needs: test-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target

      - name: Select deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*.original' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" dictalab-new.jar
          sha256sum dictalab-new.jar

      - name: Configure SSH authentication
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Upload release to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh_options=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'powershell.exe -NoLogo -NoProfile -NonInteractive -Command "New-Item -ItemType Directory -Force -Path C:\DictaLab\staging | Out-Null"'
          scp "${ssh_options[@]}" dictalab-new.jar scripts/update-windows-vps.ps1 \
            scripts/configure-admin-windows-vps.ps1 scripts/backup-windows-vps.ps1 \
            scripts/restore-drill-windows-vps.ps1 scripts/readiness-preflight.sql \
            "$VPS_USER@$VPS_HOST:C:/DictaLab/staging/"

      - name: Back up production PostgreSQL before migrations
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            'powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\\DictaLab\\staging\\backup-windows-vps.ps1'

      - name: Activate release with automatic rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum dictalab-new.jar | awk '{print $1}')"
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\\DictaLab\\staging\\update-windows-vps.ps1 -ArtifactPath C:\\DictaLab\\staging\\dictalab-new.jar -ExpectedSha256 $artifact_sha256"

      - name: Verify public health endpoint
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 --max-time 10 \
            "https://$VPS_HOST:18443/actuator/health" | jq -e '.status == "UP"'

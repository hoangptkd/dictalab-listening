name: Test and deploy to Linux VPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Validate the demo build without deploying (legacy input name)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dictalab-${{ github.event_name == 'pull_request' && github.ref || inputs.full_compatibility && 'compatibility' || github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      ai: ${{ steps.scope.outputs.ai }}
      progress: ${{ steps.scope.outputs.progress }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Select affected builds and demo releases
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_COMPATIBILITY: ${{ inputs.full_compatibility }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$CI_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            if [[ ! "$CI_BASE_SHA" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
            fi
          fi
          node scripts/ci-changes.cjs

  test-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check browser code and run JavaScript tests
        run: |
          node --check src/main/resources/static/js/app.js
          node --check src/main/resources/static/js/listening.js
          node --check src/main/resources/static/js/account.js
          node --test src/test/js/*.cjs
          node scripts/test-b1-expansion.cjs

      - name: Check release and dependency scanner behavior
        run: python3 -m unittest discover -s scripts/linux -p 'test_*.py'

      - name: Run tests and build executable JAR
        if: needs.changes.outputs.backend == 'true'
        run: mvn --batch-mode --no-transfer-progress -Pproduction-s3,ci-unit clean verify

      - name: Verify S3 production packaging and published lesson pages
        if: needs.changes.outputs.backend == 'true'
        run: python3 scripts/verify-production-jar.py target/english-dictation-0.1.0-SNAPSHOT.jar

      - name: Resolve and scan runtime dependencies
        if: needs.changes.outputs.backend == 'true'
        run: |
          mvn --batch-mode --no-transfer-progress dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 scripts/scan-dependencies.py target/runtime-dependencies.txt target/dependency-scan.json

      - name: Build and verify the immutable three-service release bundle
        if: needs.changes.outputs.release == 'true' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.PRODUCTION_DEPLOY_TARGET == 'ec2-services'
        run: |
          python3 scripts/linux/service-bundle.py build --revision "$GITHUB_SHA" --output target/services.tar.gz
          bundle_sha256="$(sha256sum target/services.tar.gz | awk '{print $1}')"
          python3 scripts/linux/service-bundle.py verify target/services.tar.gz --sha256 "$bundle_sha256"

      - name: Save the verified demo release bundle for deployment
        if: needs.changes.outputs.release == 'true' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.PRODUCTION_DEPLOY_TARGET == 'ec2-services'
        uses: actions/upload-artifact@v4
        with:
          name: application
          retention-days: 3
          path: target/services.tar.gz
          if-no-files-found: error

      - name: Save dependency scan evidence
        if: always() && needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || failure())
        continue-on-error: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          retention-days: 3
          path: |
            target/runtime-dependencies.txt
            target/dependency-scan.json

      - name: Save unit test reports
        if: always() && needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || failure())
        continue-on-error: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          retention-days: 3
          path: target/surefire-reports/

  required-checks:
    if: always()
    needs: [changes, test-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const checks = JSON.parse(process.env.NEEDS);
          for (const flag of ['backend', 'ai', 'progress', 'release']) {
            if (!['true', 'false'].includes(checks.changes.outputs[flag])) {
              throw new Error(`Missing or invalid scope: ${flag}`);
            }
          }
          if (checks.changes.outputs.release === 'true'
              && ['backend', 'ai', 'progress'].some(flag => checks.changes.outputs[flag] !== 'true')) {
            throw new Error('A release requires a complete source build');
          }
          const expected = {'changes': true, 'test-build': true};
          for (const [name, required] of Object.entries(expected)) {
            if (checks[name].result !== (required ? 'success' : 'skipped')) {
              throw new Error(`${name}: ${checks[name].result}`);
            }
          }
          NODE

  deploy:
    needs: [changes, required-checks, test-build]
    if: needs.changes.outputs.release == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_compatibility)) && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' && vars.PRODUCTION_DEPLOY_TARGET == 'ec2-services'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: application
          path: target

      - name: Verify deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_sha256="$(sha256sum target/services.tar.gz | awk '{print $1}')"
          python3 scripts/linux/service-bundle.py verify target/services.tar.gz --sha256 "$bundle_sha256" | python3 -c 'import json,os,sys; sys.exit(0 if json.load(sys.stdin)["sourceRevision"] == os.environ["GITHUB_SHA"] else "Release revision mismatch")'

      - name: Configure SSH authentication
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Assume the scoped EC2 network role through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::042407443847:role/dictalab-github-deploy-network
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          allowed-account-ids: '042407443847'

      - name: Permit SSH from this runner only
        id: runner-ssh
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)"
          runner_ip="$(python3 -c 'import ipaddress,sys; print(ipaddress.IPv4Address(sys.argv[1]))' "$runner_ip")"
          rule_id="$(aws ec2 authorize-security-group-ingress \
            --group-id sg-0e56b7760ff44be60 \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$runner_ip/32,Description=GitHub-Actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)"
          [[ "$rule_id" =~ ^sgr-[0-9a-f]+$ ]]
          printf 'rule_id=%s\n' "$rule_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the runner SSH rule to propagate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if timeout 5 bash -c 'exec 3<>/dev/tcp/54.254.221.170/22'; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Upload release to EC2
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test "$VPS_HOST" = 54.254.221.170
          ssh_options=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          )
          stage="/home/ubuntu/dictalab-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$VPS_USER" = ubuntu
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$stage'"
          scp "${ssh_options[@]}" target/services.tar.gz scripts/linux/service-release.py scripts/linux/service-schema.py "$VPS_USER@$VPS_HOST:$stage/"

      - name: Activate coordinated EC2 release with owner migration and rollback
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = 54.254.221.170
          test "$VPS_USER" = ubuntu
          bundle_sha256="$(sha256sum target/services.tar.gz | awk '{print $1}')"
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$bundle_sha256" <<'REMOTE'
          set -euo pipefail
          stage="/home/ubuntu/dictalab-release-$1-$2"
          evidence="/var/lib/dictalab-service-backups/deploy-$1-$2"
          sudo -n test ! -e /etc/caddy/dictalab-maintenance
          sudo -n install -d -m 700 "$evidence"
          sudo -n cp -a /opt/dictalab/tools/service-release.py "$evidence/service-release.py.before"
          sudo -n install -o root -g root -m 644 "$stage/service-release.py" "$stage/service-schema.py" /opt/dictalab/tools/
          python=/opt/dictalab/services/current/venv/bin/python
          sudo -n "$python" /opt/dictalab/tools/service-bundle.py stage "$stage/services.tar.gz" --sha256 "$3"
          sudo -n "$python" /opt/dictalab/tools/service-release.py "$stage/services.tar.gz" --sha256 "$3" --postgres-major 17 --migrate-core --rollback-compatible --maintenance
          sudo -n /usr/local/sbin/dictalab-services start
          REMOTE

      - name: Verify public health endpoint
        shell: bash
        env:
          PUBLIC_BASE_URL: https://dictalab.hoangptkdhy.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 --max-time 10 \
            "$PUBLIC_BASE_URL/actuator/health" | jq -e '.status == "UP"'

      - name: Revoke this runner SSH rule
        if: always() && steps.runner-ssh.outputs.rule_id != ''
        shell: bash
        env:
          RUNNER_SSH_RULE: ${{ steps.runner-ssh.outputs.rule_id }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_SSH_RULE" =~ ^sgr-[0-9a-f]+$ ]]
          aws ec2 revoke-security-group-ingress --group-id sg-0e56b7760ff44be60 \
            --security-group-rule-ids "$RUNNER_SSH_RULE"

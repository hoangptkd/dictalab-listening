name: SFT offline preparation checks

on:
  push:
    paths: ['training/**', 'services/ai-generation/app/validation.py', 'artifacts/prompts/**', '.github/workflows/training-offline.yml']
  pull_request:
    paths: ['training/**', 'services/ai-generation/app/validation.py', 'artifacts/prompts/**', '.github/workflows/training-offline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/ai-generation/requirements.lock -r training/requirements-prepare.lock pytest==8.4.2 pytest-asyncio==0.26.0 psutil==7.2.2 -r training/requirements-teacher.lock
      - run: python -m pytest -q training/tests
      - run: python -m compileall -q training
      - run: git diff --check

  cpu-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements-cpu.lock -r services/ai-generation/requirements.lock pytest-asyncio==0.26.0 -r training/requirements-teacher.lock
      - run: python -m pytest -q training/tests
        env:
          SFT_RUN_RUNTIME_TESTS: '1'

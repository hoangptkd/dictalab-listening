groups:
  - name: dictalab
    rules:
      - alert: DictaLabUnavailable
        expr: up{job="dictalab"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: DictaLab management scrape is unavailable
          action: Verify Windows service, local health and management tunnel; do not expose Actuator publicly.
      - alert: DictaLabServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="dictalab",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="dictalab"}[5m])),1) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Sustained server error rate exceeds 1 percent
          action: Use errorId/requestId in structured logs; inspect DB pool, jobs and provider health before retrying writes.
      - alert: DictaLabSlowRequests
        expr: histogram_quantile(0.95,sum by (le) (rate(http_server_requests_seconds_bucket{job="dictalab",uri!~"/api/v1/conversation.*|/api/v1/listening.*|/api/admin/.*|/api/v1/practice-sessions/.*/coach"}[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Core HTTP p95 exceeds the proposed 1 second target
          action: Split by route; AI synchronous routes have different latency budgets. Inspect pool/GC and query plans.
      - alert: DictaLabPoolSaturated
        expr: hikaricp_connections_active{job="dictalab"} / hikaricp_connections_max{job="dictalab"} > 0.9
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Database pool remains above 90 percent utilization
          action: Inspect pending connections and database locks; do not simply increase pool size.
      - alert: DictaLabJobStalled
        expr: dictalab_jobs_oldest_seconds{job="dictalab",type="listening"} > 180 or dictalab_jobs_oldest_seconds{job="dictalab",type="email"} > 300
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A durable job has exceeded its processing budget
          action: Inspect status/attempts/lease and sanitized last error; use authorized bounded retry, never reset all attempts.
      - alert: DictaLabProviderOpen
        expr: dictalab_provider_circuit{job="dictalab"} == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Provider circuit remains open
          action: Verify credentials/quota/provider outage; keep learner drafts and allow one half-open recovery probe.
      - alert: DictaLabBackupStale
        expr: dictalab_backup_age_seconds{job="dictalab"} > 90000 or dictalab_backup_age_seconds{job="dictalab"} < 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Verified backup is missing or older than 25 hours
          action: Check backup task, free disk and checksum manifest; run isolated restore drill before declaring recovery ready.
  - name: dictalab-ai-platform
    rules:
      - alert: DictaLabGeminiQuotaUnavailable
        expr: dictalab_gemini_quota_available{job="dictalab-ai"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Shared Gemini quota admission is unavailable
          action: Pause new admission and check Redis; preserve counters and pending jobs, never switch to memory in production.
      - alert: DictaLabGeminiRpdLow
        expr: dictalab_gemini_rpd_remaining_ratio{job="dictalab-ai"} < 0.2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Gemini project has less than 20 percent daily quota remaining
          action: Reduce batch rate or wait for Pacific midnight; verify the configured RPD against AI Studio.
      - alert: DictaLabGeminiRateLimited
        expr: (sum by (provider,model) (increase(dictalab_gemini_events_total{outcome="429"}[15m])) / clamp_min(sum by (provider,model) (increase(dictalab_gemini_events_total{outcome="allowed"}[15m])),1) > 0.01) and on (provider,model) (sum by (provider,model) (increase(dictalab_gemini_events_total{outcome="allowed"}[15m])) >= 20)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Gemini 429 rate exceeds 1 percent
          action: Lower operating RPM and inspect TPM and RPD; do not retry sent jobs or erase quota counters.
      - alert: DictaLabAiWorkerDown
        expr: dictalab_ai_worker_up{job="dictalab-ai"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: AI worker heartbeat is missing
          action: Check worker and broker health; preserve the ledger and reconcile UNKNOWN jobs before retrying.
      - alert: DictaLabAiOutcomeUnknown
        expr: dictalab_ai_jobs{job="dictalab-ai",status="UNKNOWN"} > 0
        labels: {severity: warning}
        annotations:
          summary: AI job has an uncertain provider outcome
          action: Inspect provider outcome before an explicit Java retry; never replay a paid call blindly.
      - alert: DictaLabAiQueueWait
        expr: dictalab_ai_job_queue_wait_seconds{job="dictalab-ai"} > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Oldest AI job waits over 20 seconds
          action: Pause canary expansion and inspect model capacity and queue depth before adding workers.
      - alert: DictaLabAiQueueBacklog
        expr: dictalab_ai_jobs{job="dictalab-ai",status="PENDING"} > 100
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: AI job backlog exceeds 100
          action: Check provider capacity and admission budgets; do not reset attempts or delete queued jobs.
      - alert: DictaLabAiJobFailures
        expr: (sum by (kind) (increase(dictalab_ai_platform_duration_seconds_count{outcome="failed"}[15m])) / clamp_min(sum by (kind) (increase(dictalab_ai_platform_duration_seconds_count[15m])),1) > 0.01) and on (kind) (sum by (kind) (increase(dictalab_ai_platform_duration_seconds_count[15m])) >= 100)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: AI capability failure rate exceeds the pilot threshold
          action: Stop expansion and roll back the affected capability independently; preserve learner history.

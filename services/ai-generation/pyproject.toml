[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictalab-ai-generation"
version = "0.1.0"
description = "Conversation generation boundary for DictaLab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
  "pika==1.4.4",
  "redis>=5,<6",
  "tzdata>=2025.1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["*.lua"]
